<title>فريق مبيعات سكن</title><link rel="icon" href="favicon.ico" sizes="any">
<style>
:root{--bg:#FAF6F1;--surface:#FEFCF9;--ink:#3D2F2F;--soft:#7A6660;--maroon:#6B2737;--line:#E4D6C8;}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tahoma,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 20px;width:100%;max-width:380px;text-align:center;box-shadow:0 18px 40px -24px rgba(107,39,55,.35)}
.ic{width:54px;height:54px;border-radius:999px;background:var(--maroon);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:24px}
h1{font-size:20px;margin-bottom:6px}p{color:var(--soft);font-size:14px;margin-bottom:16px}
input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;font-size:16px;background:#fff;color:var(--ink);text-align:center}
input:focus{outline:2px solid var(--maroon);border-color:var(--maroon)}
button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:14px;background:var(--maroon);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}.err{color:#A3263B;font-size:13.5px;min-height:20px;margin-top:10px}
a{display:inline-block;margin-top:14px;color:var(--maroon);font-size:13.5px}
</style></head><body>

function u(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
async function open_(pw){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  return new TextDecoder().decode(pt);
}
async function tryPw(pw,quiet){
  var b=document.getElementById('go'),e=document.getElementById('err');
  b.disabled=true;b.textContent='...';
  try{var html=await open_(pw);try{sessionStorage.setItem('skn',pw);}catch(_){}
    document.open();document.write(html);document.close();}
  catch(_){if(!quiet)e.textContent='الباسورد غلط، جرّب تاني.';b.disabled=false;b.textContent='دخول';}
}
document.getElementById('f').onsubmit=function(ev){ev.preventDefault();tryPw(document.getElementById('pw').value);};
